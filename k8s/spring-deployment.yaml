apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-config
  namespace: devops
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-service:3306/springdb"
---
apiVersion: v1
kind: Secret
metadata:
  name: spring-secret
  namespace: devops
type: Opaque
data:
  SPRING_DATASOURCE_USERNAME: c3ByaW5n
  SPRING_DATASOURCE_PASSWORD: c3ByaW5nMTIz
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z mysql-service 3306; do sleep 3; done']
      containers:
      - name: backend
        image: emnablel/emna-5arctic8-appgestion-backend:latest
        ports:
        - containerPort: 8089
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx256m"
        envFrom:
        - configMapRef:
            name: spring-config
        - secretRef:
            name: spring-secret
        resources:
          requests:
            memory: "200Mi"
          limits:
            memory: "600Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devops
spec:
  type: NodePort
  selector:
    app: backend
  ports:
  - name: atelier
    port: 8080
    targetPort: 8089
    nodePort: 30081
  - name: app
    port: 8089
    targetPort: 8089
